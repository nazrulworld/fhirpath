# Config file for automatic testing at travis-ci.com
os: linux
dist: jammy
language: python

# Elasticsearch (and PostgreSQL) for the search tests are started by
# pytest-docker-fixtures, see tests/fixtures.py
services:
  - docker

python:
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"

cache: pip

install:
  - pip install -U pip
  - pip install -e .[test]

script:
  - pytest --tb=native -v --cov=src/fhirpath --cov-report=term-missing --cov-report=xml tests

after_success:
  # needs CODECOV_TOKEN in the Travis repository settings
  - pip install codecov-cli
  - codecovcli upload-process --file coverage.xml || true

jobs:
  include:
    # Static checks run once, separately from the test matrix. They are allowed
    # to fail until the existing code base has been cleaned up for them.
    - name: Lint
      python: "3.12"
      services: []
      install:
        - pip install -U pip
        - pip install -e .[lint]
      script:
        - flake8 src/fhirpath tests
        - isort --check-only --diff src/fhirpath tests
        - black --check src/fhirpath tests
        - mypy src/fhirpath
      after_success: skip
  allow_failures:
    - name: Lint
  fast_finish: true

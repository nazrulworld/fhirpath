# https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html
[project]
name = "fhirpath"
version = "1.0.1"
description = "FHIRPath implementation in Python."
authors = [
    {name = "Md Nazrul Islam", email = "email2nazrul@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["fhirpath", "HL7", "FHIR", "healthcare", "IHE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "zope.interface>=5.1.2",
    "multidict",
    "fhirspec>=0.4.0",
    "fhir.resources>=8.3.0,<9.0",
    "antlr4-python3-runtime==4.9.3",
    "yarl",
    "isodate",
]
# long_description is README.rst + HISTORY.rst
dynamic = ["readme"]

[project.optional-dependencies]
test = [
    "lxml",
    "pyyaml",
    "more-itertools",
    "pytest>=6.0.1",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-docker-fixtures",
    "psycopg2-binary",
    "elasticsearch[async]>7.8.0,<8.0.0",
    "SQLAlchemy",
    "pytz",
    "requests>=2.31",
    # pytest-docker-fixtures needs docker-py >= 7.1 with requests >= 2.32
    "docker>=7.1",
    "pytest-runner",
    "setuptools_scm[toml]",
    "wheel",
]
lint = [
    "flake8>=7",
    "flake8-bugbear",
    "isort>=5",
    "black",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-httpdomain",
    "sphinxcontrib-httpexample",
]
dev = [
    "Jinja2==2.11.1",
    "MarkupSafe==1.1.1",
    "colorlog==2.10.0",
    "certifi",
    "orjson",
    "zest-releaser[recommended]",
]
all = ["fhirpath[test,lint,docs,dev]"]

[project.urls]
Homepage = "https://nazrul.me/fhirpath/"
"CI: Travis" = "https://travis-ci.org/nazrulworld/fhirpath"
"Coverage: codecov" = "https://codecov.io/github/nazrulworld/fhirpath"
"Docs: RTD" = "https://fhirpath.readthedocs.io/"
"GitHub: issues" = "https://github.com/nazrulworld/fhirpath/issues"
"GitHub: repo" = "https://github.com/nazrulworld/fhirpath"

[project.scripts]
fhirpath = "fhirpath.__main__:main"

[build-system]
requires = [
    "setuptools >= 77.0.0",
    "setuptools_scm[toml]>=3.4.3",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["fhirpath*"]

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "HISTORY.rst"], content-type = "text/x-rst"}

[tool.black]
line-length = 88
target_version = ['py310']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.env
    | _build
    | buck-out
    | build
    | dist
  )/
  | setup.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''
[tool.setuptools_scm]
write_to = "src/fhirpath/version.py"
write_to_template = '''
# _*_ coding: utf-8 _*_
# file generated by setuptools_scm
# don't change, don't track in version control
__version__ = {version!r}
'''

[mypy]
python_version = 3.10
ignore_missing_imports = True
# generated by ANTLR
exclude = src/fhirpath/core/antlr4_grammer/
[mypy-fhirpath.core.antlr4_grammer.*]
# still followed through imports
ignore_errors = True
[mypy-fhirpath.search.interfaces.*]
ignore_errors = True
[mypy-fhirpath.thirdparty.*]
ignore_errors = True
